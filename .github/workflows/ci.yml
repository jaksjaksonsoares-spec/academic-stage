name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  banco:
    name: Banco de dados (migrações + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações e rodar testes de segurança do banco
        run: |
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/supabase_stub.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/rls_test.sql
          psql -v ON_ERROR_STOP=1 -q -f tests/sql/fase2_test.sql

  app:
    name: Aplicação (tipos, testes e build)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://exemplo.academicstage.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-apenas-para-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Testes unitários
        run: npm test
      - name: Build de produção (inclui verificação de tipos)
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Publica as linhas de erro como anotações (visíveis na aba Checks).
            grep -n -i -E "^\./|error|failed|cannot|not assignable|does not exist|module not found" build.log | head -20 | while IFS= read -r line; do
              echo "::error title=build::${line//%/%25}"
            done
          fi
          exit $status
      - name: Verificação de tipos completa (inclui testes)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc.log
          status=${PIPESTATUS[0]}
          grep -E "error TS" tsc.log | head -20 | while IFS= read -r line; do echo "::error title=tsc::$line"; done
          exit $status
      - name: Auditoria de dependências (alto risco)
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          status=$?
          npm ls next react @supabase/ssr --depth=0 | while IFS= read -r l; do echo "::notice title=versions::$l"; done
          if [ $status -ne 0 ]; then
            grep -E "^[a-z@]|Severity|fix available|GHSA|Depends on" audit.txt | head -20 | while IFS= read -r l; do echo "::error title=audit::$l"; done
          fi
          exit $status
